name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an older, still running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large and useless across CI runs: they only bloat
  # the cache.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-22.04

    # K9db is a research MySQL-protocol proxy (sharded/owned-table schema:
    # `CREATE DATA_SUBJECT TABLE`, `OWNED_BY`). It rejects DROP DATABASE, DROP
    # TABLE and even SHOW TABLES outright (syntax error), so the app's own
    # priming can only ever CREATE, never reset -- a data directory that
    # survives from a previous run makes priming fail with "Table exists" (see
    # [[k9db_docker_setup]] memory / the k9db-data volume note in the docker
    # run instructions). Deliberately not giving this service a `volumes:`
    # entry keeps every run's data directory anonymous and thrown away with
    # the runner VM, so this can never come back. Do not add caching for it:
    # a cached data directory is exactly the failure this avoids.
    #
    # No `--health-cmd`: GitHub Actions runs that inside the container via
    # `docker exec`, and we don't know that this image ships any client tool
    # to exec into. Readiness is checked from the runner instead.
    services:
      k9db:
        image: kinanbab/k9db:latest
        ports:
          - 10001:10001

    steps:
      - uses: actions/checkout@v4

      # The WASM sandbox is expensive to build (it fetches and compiles
      # rlbox_wasm2c, and needs a second, older nightly plus wasi tooling), so
      # the .so it produces is committed. Sesame's build script skips the whole
      # thing when it finds the file, which is the only reason this workflow
      # can be a plain `cargo test`. Fail early and clearly if it goes missing.
      - name: Check the prebuilt sandbox is committed
        run: |
          so=websubmit_boxed_sandboxes/libwebsubmit_boxed_sandboxes_sandbox.so
          if [ ! -f "$so" ]; then
            echo "::error::$so is missing. It is committed on purpose: without"
            echo "::error::it, sesame_build rebuilds the sandbox from scratch,"
            echo "::error::which needs nightly-2023-10-06, rust-src and wasi."
            exit 1
          fi
          ls -l "$so"

      # The pinned nightly carries rustc-dev and rust-src, which are a slow
      # several hundred megabytes to fetch.
      - name: Cache the rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      # Any cargo invocation inside the repo makes rustup install the toolchain
      # that rust-toolchain.toml pins, with the components it names.
      - name: Install the pinned toolchain
        run: |
          cargo --version --verbose
          rustc --version --verbose

      # Caches ~/.cargo/registry, ~/.cargo/git (the sesame checkouts) and
      # target/. Pull requests restore main's cache but do not write their own.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # K9db only implements a restricted subset of SQL: even `SELECT 1` and
      # `SELECT VERSION()` fail ("Unsupported select modifiers"), because
      # neither has a FROM clause it can route to a shard, so there is no SQL
      # query that works as a readiness probe. `mysqladmin ping` is a
      # wire-protocol ping, not a query, so it works.
      #
      # An earlier version of this step grepped `docker logs
      # ${{ job.services.k9db.id }}` for the "Listening at" line K9db prints on
      # startup (confirmed instant locally via a plain `docker run -d`). That
      # context field is real and documented, but in an actual run here the
      # logs came back empty regardless -- `docker logs` against a GitHub
      # Actions service container isn't a reliable signal, for reasons this
      # repo couldn't pin down further. Prefer this network-level check.
      - name: Wait for K9db
        run: |
          if ! command -v mysqladmin > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mysql-client
          fi
          for _ in $(seq 1 150); do
            if mysqladmin -h 127.0.0.1 -P 10001 -uroot -ppassword ping > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          mysqladmin -h 127.0.0.1 -P 10001 -uroot -ppassword ping

      - name: Build
        run: cargo test --workspace --locked --no-run

      - name: Check the sandbox was linked, not rebuilt
        run: git diff --exit-code -- websubmit_boxed_sandboxes

      # .cargo/config.toml sets RUST_TEST_THREADS=1: the e2e tests share one
      # database and must not run concurrently.
      - name: Test
        run: cargo test --workspace --locked
