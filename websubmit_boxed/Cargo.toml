[package]
name = "websubmit_boxed"
version = "0.1.0"
authors = ["Malte Schwarzkopf <malte@cs.brown.edu>"]
edition = "2018"
build = "build.rs"

[dependencies]
sesame = { git = "https://github.com/brownsys/Sesame", branch = "main", default-features = false, features = ["derive"] }
sesame_mysql = { git = "https://github.com/brownsys/Sesame", branch = "main", default-features = false, features = ["derive"] }
sesame_rocket = { git = "https://github.com/brownsys/Sesame", branch = "main", default-features = false, features = ["derive", "mysql"] }
chrono = { version = "0.4.0", features = ["serde"] }
clap = "2.33.0"
lettre = { version = "0.10", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname", "pool"] }
mysql = "21.0.2"
mysql_common = "0.22"
rand = "0.8.4"
rocket = { git = "https://github.com/KinanBab/Rocket.git", branch = "main" }
slog = { version = "2.4.0", features = ["max_level_trace", "release_max_level_trace"] }
slog-term = "2.4.0"
time = { version = "0.2.11", default-features = false, features = ["std"] }
toml = "0.2.1"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
websubmit_boxed_sandboxes = { path = "../websubmit_boxed_sandboxes" }

[dependencies.rocket_dyn_templates]
git = "https://github.com/KinanBab/Rocket.git"
branch = "main"
features = ["handlebars", "tera"]

[dependencies.handlebars]
features = ["dir_source"]
version = "3.5.5"

[build-dependencies]
sesame_build = { git = "https://github.com/brownsys/Sesame", branch = "main" }
