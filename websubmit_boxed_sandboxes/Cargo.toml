[package]
name = "websubmit_boxed_sandboxes"
version = "0.1.0"
authors = ["Kinan Dak Albab <kinan.bab.14@gmail.com>"]
edition = "2018"
build = "build.rs"

[dependencies]
chrono = { version = "0.4.0", features = ["serde"] }
linfa = "0.6.1"
linfa-linear = "0.6.1"
ndarray = "0.15.6"
sha2 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sesame_derive = { git = "https://github.com/brownsys/Sesame", branch = "main" }
sesame_sandbox = { git = "https://github.com/brownsys/Sesame", branch = "main" }

[build-dependencies]
sesame_build = { git = "https://github.com/brownsys/Sesame", branch = "main" }

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[package.metadata]
sandboxes = [
    "hash", 
    "train"
]

[features]
default = []
sandbox_timing = ["sesame_sandbox/sandbox_timing"]
